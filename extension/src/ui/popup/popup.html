<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Billed</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="popup">
  <header class="popup-head">
    <img src="../../../assets/icons/icon-32.png" width="18" height="18" alt="">
    <strong>Billed</strong>
    <span id="plan-pill" class="pill">Free</span>
    <span class="grow"></span>
    <button id="open-dashboard" class="btn btn-sm btn-dark">Open dashboard</button>
  </header>

  <main>
    <section class="hero">
      <div class="hero-main">
        <span id="today-hours" class="hero-number nums">0.00</span>
        <span class="hero-unit">h billable today</span>
      </div>
      <div id="today-meta" class="hero-meta muted small"></div>
    </section>

    <div id="review-banner" class="banner hidden"></div>

    <section class="card card-pad now">
      <div class="label">Right now</div>
      <div id="now-body" class="now-body"></div>
      <div id="assign-slot"></div>
    </section>

    <section id="clients-slot"></section>
  </main>

  <footer class="popup-foot">
    <button id="toggle-pause" class="btn btn-sm btn-ghost">Pause 1 hour</button>
    <span class="grow"></span>
    <button id="goto-review" class="btn btn-sm">Review week</button>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
